[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unibee"
version = "1.1.0"
description = "UniBee Python SDK - Billing API client for SaaS businesses"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "UniBee", email = "support@unibee.dev"},
]
keywords = [
    "unibee",
    "billing",
    "subscription",
    "payment",
    "saas",
    "invoice",
    "api",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "urllib3>=1.25.3,<3.0.0",
    "python-dateutil>=2.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://unibee.dev"
Documentation = "https://docs.unibee.dev/"
Repository = "https://github.com/UniBee-Billing/unibee-python-client"
"Bug Tracker" = "https://github.com/UniBee-Billing/unibee-python-client/issues"

[tool.setuptools.packages.find]
include = ["unibee*"]
exclude = ["test*", "docs*", "openapi_client*"]

[tool.setuptools.package-data]
unibee = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | openapi_client
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["openapi_client"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
exclude = ["openapi_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
