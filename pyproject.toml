[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unibee"
version = "2.0.0"
description = "UniBee Python SDK - A modern Python client for the UniBee billing API"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "UniBee Team", email = "support@unibee.dev"},
]
maintainers = [
    {name = "UniBee Team", email = "support@unibee.dev"},
]
keywords = [
    "unibee",
    "billing",
    "subscription",
    "payment",
    "saas",
    "recurring",
    "invoice",
    "api",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "urllib3>=1.25.3",
    "python-dateutil>=2.8.2",
    "pydantic>=2",
    "typing-extensions>=4.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.1",
    "pytest-cov>=4.0.0",
    "flake8>=4.0.0",
    "mypy>=1.4.1",
    "types-python-dateutil>=2.8.19.14",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.urls]
Homepage = "https://unibee.dev"
Documentation = "https://docs.unibee.dev/documentation"
Repository = "https://github.com/UniBee-Billing/unibee-python-client"
Issues = "https://github.com/UniBee-Billing/unibee-python-client/issues"
Changelog = "https://github.com/UniBee-Billing/unibee-python-client/releases"

[tool.setuptools.packages.find]
include = ["unibee*", "openapi_client*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
